<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">Restart Temper</title>
  <desc id="desc">A warm workshop altar of tools, steel beams, diagnostic light, and molten repair seams after a system restart.</desc>
  <defs>
    <radialGradient id="heat" cx="50%" cy="58%" r="58%">
      <stop offset="0%" stop-color="#f8cf67"/>
      <stop offset="28%" stop-color="#b86c29"/>
      <stop offset="62%" stop-color="#33231c"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </radialGradient>
    <linearGradient id="steel" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#2e3439"/>
      <stop offset="52%" stop-color="#111417"/>
      <stop offset="100%" stop-color="#475059"/>
    </linearGradient>
    <linearGradient id="goldSeam" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#8d5a1c"/>
      <stop offset="45%" stop-color="#ffe18a"/>
      <stop offset="100%" stop-color="#c17a24"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#24282c" stroke-width="2" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1600" height="1600" fill="#090a0c"/>
  <rect width="1600" height="1600" fill="url(#heat)" opacity="0.92"/>
  <rect width="1600" height="1600" fill="url(#grid)" opacity="0.55"/>

